name: local Build

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Select target ABI for the build"
        required: false
        default: "all"
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        abi: ${{ (github.event.inputs.abi == 'all' || github.event.inputs.abi == '' || github.event.inputs.abi == null) && fromJson('["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]') || fromJson(format('["{0}"]', github.event.inputs.abi)) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 手动下载并配置 NDK r30-beta2 (Windows 版)
      - name: Setup NDK r30-beta2
        run: |
          curl -L -o android-ndk-r30-beta2-windows.zip "https://dl.google.com/android/repository/android-ndk-r30-beta2-windows.zip?hl=zh-cn"
          7z x android-ndk-r30-beta2-windows.zip -y
          $ndkPath = "$pwd\android-ndk-r30-beta2"
          echo "ANDROID_NDK_HOME=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$ndkPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set ABI environment variable
        run: |
          echo "ABI=${{ matrix.abi }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Build ABI and Platform (android-35)
        run: |
          Write-Host "Setting ABI to $env:ABI and Platform to android-35"
          $file = "Application.mk"
          $abiLine = "APP_ABI := $env:ABI"
          $platformLine = "APP_PLATFORM := android-35"

          if (Test-Path $file) {
            $content = Get-Content $file
            $abiFound = $false
            $platformFound = $false
            for ($i=0; $i -lt $content.Count; $i++) {
              if ($content[$i] -match "^APP_ABI\s*:=") {
                $content[$i] = $abiLine
                $abiFound = $true
              }
              if ($content[$i] -match "^APP_PLATFORM\s*:=") {
                $content[$i] = $platformLine
                $platformFound = $true
              }
            }
            if (-not $abiFound) { $content += $abiLine }
            if (-not $platformFound) { $content += $platformLine }
            $content | Set-Content $file
          } else {
            $abiLine, $platformLine | Set-Content $file
          }

      - name: Build Static Library
        id: build-static
        continue-on-error: true
        run: |
          cmd /c "build-release.bat 2> errors-static-${{ matrix.abi }}.txt"
          if (Test-Path jniLibs) {
            Move-Item -Path jniLibs -Destination static_libs -Force -ErrorAction SilentlyContinue
          }

      - name: Build Shared Library
        id: build-shared
        continue-on-error: true
        run: |
          ./.github-deps/change-to-shared-lib.ps1
          cmd /c "build-release.bat 2> errors-shared-${{ matrix.abi }}.txt"
          if (Test-Path jniLibs) {
            Move-Item -Path jniLibs -Destination shared_libs -Force -ErrorAction SilentlyContinue
          }

      - name: Set error-log to var (Static Build)
        uses: actions/github-script@v9
        id: error-log-static
        if: steps.build-static.outcome != 'success'
        with:
          script: |
            const fs = require('fs');
            const file = `errors-static-${{ matrix.abi }}.txt`;
            return fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          result-encoding: string

      - name: Set error-log to var (Shared Build)
        uses: actions/github-script@v9
        id: error-log-shared
        if: steps.build-shared.outcome != 'success'
        with:
          script: |
            const fs = require('fs');
            const file = `errors-shared-${{ matrix.abi }}.txt`;
            return fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          result-encoding: string

      - name: Collect and Organize Binaries
        if: always()
        run: |
          New-Item -ItemType Directory -Path all_libs/static -Force
          New-Item -ItemType Directory -Path all_libs/shared -Force
          if (Test-Path static_libs) {
            Get-ChildItem -Path static_libs -Recurse -File | Move-Item -Destination all_libs/static/ -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path shared_libs) {
            Get-ChildItem -Path shared_libs -Recurse -File | Move-Item -Destination all_libs/shared/ -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: steps.build-static.outcome == 'success' || steps.build-shared.outcome == 'success'
        with:
          name: imagemagick-7-android-${{ matrix.abi }}
          path: all_libs

      - uses: mshick/add-pr-comment@v3
        name: Add error log to PR
        if: github.event_name == 'pull_request' && (steps.build-static.outcome != 'success' || steps.build-shared.outcome != 'success')
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-repeats: true
          message: |
            The build just failed compilation :weary:

            Here is the error log from the build :confused: Please check it and fix any problems in your code :open_mouth:

            <details>
            <summary>Expand Stderr Log (Static)</summary>
            ${{ steps.error-log-static.outputs.result }}
            </details>
            <details>
            <summary>Expand Stderr Log (Shared)</summary>
            ${{ steps.error-log-shared.outputs.result }}
            </details>

      - name: Static build errors
        if: steps.build-static.outcome != 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = `errors-static-${{ matrix.abi }}.txt`;
            if (fs.existsSync(file)) {
              console.log(fs.readFileSync(file, 'utf8'));
            }
            core.setFailed('Static build failed');

      - name: Shared build errors
        if: steps.build-shared.outcome != 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = `errors-shared-${{ matrix.abi }}.txt`;
            if (fs.existsSync(file)) {
              console.log(fs.readFileSync(file, 'utf8'));
            }
            core.setFailed('Shared build failed');
